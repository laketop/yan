<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>豆瓣电影 Top 100 · 随机抽签</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    background: radial-gradient(1200px 800px at 50% -10%, #2b2f4a 0%, #141625 60%, #0d0e18 100%);
    color: #f2f3f7;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px 60px;
  }
  h1 {
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 2px;
    margin-bottom: 8px;
  }
  .sub { color: #9aa0b8; font-size: 14px; margin-bottom: 36px; }

  .card {
    width: 100%;
    max-width: 520px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 20px;
    padding: 40px 28px;
    text-align: center;
    backdrop-filter: blur(8px);
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    min-height: 220px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
  }
  .placeholder { color: #6b7188; font-size: 16px; }

  .rank {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 72px;
    height: 32px;
    padding: 0 14px;
    border-radius: 999px;
    background: linear-gradient(135deg, #e8b33d, #d18f1f);
    color: #1a1205;
    font-weight: 700;
    font-size: 15px;
    margin-bottom: 18px;
  }
  .movie {
    font-size: 30px;
    font-weight: 700;
    line-height: 1.4;
    word-break: break-word;
  }
  .year { margin-top: 10px; color: #9aa0b8; font-size: 15px; }

  button {
    margin-top: 30px;
    padding: 15px 44px;
    font-size: 17px;
    font-weight: 600;
    color: #141625;
    background: linear-gradient(135deg, #f5c95c, #e8a93d);
    border: none;
    border-radius: 999px;
    cursor: pointer;
    letter-spacing: 1px;
    box-shadow: 0 10px 26px rgba(232,169,61,0.35);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  button:hover { transform: translateY(-2px); box-shadow: 0 14px 30px rgba(232,169,61,0.45); }
  button:active { transform: translateY(0); }

  .history {
    width: 100%;
    max-width: 520px;
    margin-top: 30px;
  }
  .history h2 { font-size: 14px; color: #9aa0b8; font-weight: 500; margin-bottom: 12px; }
  .history-list { display: flex; flex-wrap: wrap; gap: 8px; }
  .history-list span {
    font-size: 13px;
    color: #cfd3e4;
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 8px;
    padding: 6px 10px;
  }
  .history-list .h-rank { color: #e8b33d; margin-right: 6px; }

  @keyframes pop {
    0% { opacity: 0; transform: scale(.85); }
    100% { opacity: 1; transform: scale(1); }
  }
  .pop { animation: pop .3s ease; }
</style>
</head>
<body>

  <h1>豆瓣电影 Top 100</h1>
  <div class="sub">点击按钮，随机抽一部今晚看</div>

  <div class="card" id="card">
    <div class="placeholder">🎬 按下按钮，看看抽中哪部</div>
  </div>

  <button id="drawBtn">抽一部电影</button>

  <div class="history">
    <h2>最近抽中</h2>
    <div class="history-list" id="history"></div>
  </div>

<script>

    { title: "三傻大闹宝莱坞", year: "2009" },
    { title: "放牛班的春天", year: "2004" },
    { title: "无间道", year: "2002" },

    { title: "大话西游之大圣娶亲", year: "1995" },
    { title: "熔炉", year: "2011" },

    { title: "当幸福来敲门", year: "2006" },
    { title: "活着", year: "1994" },

    { title: "蝙蝠侠：黑暗骑士", year: "2008" },

    { title: "我不是药神", year: "2018" },

    { title: "鬼子来了", year: "2000" },
    { title: "摔跤吧！爸爸", year: "2016" },
    { title: "少年派的奇幻漂流", year: "2012" },
    { title: "钢琴家", year: "2002" },
    { title: "死亡诗社", year: "1989" },

    { title: "绿皮书", year: "2018" },
    { title: "何以为家", year: "2018" },

    { title: "本杰明·巴顿奇事", year: "2008" },
    { title: "搏击俱乐部", year: "1999" },
    { title: "美丽心灵", year: "2001" },
    { title: "穿条纹睡衣的男孩", year: "2008" },

    { title: "美国往事", year: "1984" },
    { title: "红辣椒", year: "2006" },
    { title: "七宗罪", year: "1995" },
    { title: "唐伯虎点秋香", year: "1993" },
    { title: "狩猎", year: "2012" }
  ];

  const card = document.getElementById("card");
  const historyBox = document.getElementById("history");
  let lastIndex = -1;
  let history = [];

  function draw() {
    let i;
    do {
      i = Math.floor(Math.random() * movies.length);
    } while (movies.length > 1 && i === lastIndex);
    lastIndex = i;

    const m = movies[i];
    card.innerHTML =
      '<div class="pop">' +
        '<div class="rank">No.' + (i + 1) + '</div>' +
        '<div class="movie">' + m.title + '</div>' +
        '<div class="year">（' + m.year + '）</div>' +
      '</div>';

    history.unshift({ rank: i + 1, title: m.title });
    if (history.length > 10) history.pop();
    historyBox.innerHTML = history.map(h =>
      '<span><span class="h-rank">No.' + h.rank + '</span>' + h.title + '</span>'
    ).join("");
  }

  document.getElementById("drawBtn").addEventListener("click", draw);
</script>
</body>
</html>
